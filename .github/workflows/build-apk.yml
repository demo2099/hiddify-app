name: Build APK with ECH Support
on:
  push:
    branches: [ech-support]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          ref: ech-support
      - run: echo submodule-check
      - run: ls hiddify-core && ls hiddify-core/go.mod || echo no-go-mod

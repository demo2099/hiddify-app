name: Build APK with ECH Support

on:
  push:
    branches: [ech-support]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.38.5'
  JAVA_VERSION: '17'
  GOTOOLCHAIN: local

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - name: Force HTTPS for all git URLs
        run: |
          SSH_PREFIX=$(printf 'Z2l0QGdpdGh1Yi5jb206' | base64 -d)
          git config --global "url.https://github.com/.insteadOf" "$SSH_PREFIX"
          git config --global "url.https://github.com/.insteadOf" "ssh://${SSH_PREFIX/:/}"
          {
            echo "GIT_CONFIG_COUNT=2"
            echo "GIT_CONFIG_KEY_0=url.https://github.com/.insteadOf"
            echo "GIT_CONFIG_VALUE_0=$SSH_PREFIX"
            echo "GIT_CONFIG_KEY_1=url.https://github.com/.insteadOf"
            echo "GIT_CONFIG_VALUE_1=ssh://${SSH_PREFIX/:/}"
          } >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          ref: ech-support

      - name: Init submodules
        run: |
          SSH_PREFIX=$(printf 'Z2l0QGdpdGh1Yi5jb206' | base64 -d)
          git config --global "url.https://github.com/.insteadOf" "$SSH_PREFIX"
          git config --global "url.https://github.com/.insteadOf" "ssh://${SSH_PREFIX/:/}"
          git submodule update --init || true
          if [ -d hiddify-core ]; then
            cd hiddify-core
            git submodule sync --recursive
            git submodule update --init --recursive || true
            cd ..
          fi
          echo "=== submodule status ==="
          git submodule status
          echo "=== hiddify-core submodule status ==="
          cd hiddify-core && git submodule status 2>/dev/null || true
          echo "=== done ==="

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.6'
          check-latest: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.21.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3

      - name: Clean up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          rm -rf ~/.gradle/caches
          df -h

      - name: Install NDK and SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "ndk;28.2.13676358" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install gomobile v0.1.11
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.11
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.11

      - name: Build hiddify-core AAR
        working-directory: hiddify-core
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          export ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/28.2.13676358
          echo "=== hiddify-sing-box ==="
          cd hiddify-sing-box && git log --oneline -1 && cd ..
          echo "=== gomobile in go.mod ==="
          grep gomobile go.mod
          go version
          echo "=== go.mod directives BEFORE tidy ==="
          grep -E '^(go|toolchain)' go.mod
          cp go.mod /tmp/go.mod.orig
          cp go.sum /tmp/go.sum.orig
          echo "=== pin modules tidy would otherwise resolve to @latest ==="
          echo "  showwin/speedtest-go -> v1.8.0  (v1.8.1+ declare go 1.26)"
          echo "  xmdhs/clash2singbox  -> v0.2.0  (v0.1.4 has no model package)"
          go mod edit -require=github.com/showwin/speedtest-go@v1.8.0
          go mod edit -require=github.com/xmdhs/clash2singbox@v0.2.0
          set +e
          go mod tidy > /tmp/gomod_tidy.log 2>&1
          TIDY_RC=$?
          set -e
          echo "=== go mod tidy rc=$TIDY_RC (last 60 lines) ==="
          tail -60 /tmp/gomod_tidy.log
          echo "=== go version AFTER tidy (must still be go1.25.6) ==="
          go version
          echo "=== go.mod directives AFTER tidy ==="
          grep -E '^(go|toolchain)' go.mod
          echo "=== go.mod diff vs committed ==="
          diff /tmp/go.mod.orig go.mod || true
          echo "=== go.sum diff vs committed (first 40) ==="
          diff /tmp/go.sum.orig go.sum | head -40 || true
          echo "=== resolved versions of drifted modules ==="
          go list -m github.com/andybalholm/brotli github.com/klauspost/compress github.com/klauspost/reedsolomon github.com/xtaci/smux github.com/metacubex/utls github.com/refraction-networking/utls github.com/net2share/vaydns github.com/xmdhs/clash2singbox github.com/showwin/speedtest-go || true
          echo "=== assert speedtest-go was not upgraded past v1.8.0 ==="
          go list -m github.com/showwin/speedtest-go | grep -qE 'v1\.(7|8\.0)' || { echo "::error::speedtest-go drifted:"; go list -m github.com/showwin/speedtest-go; exit 1; }
          [ "$TIDY_RC" -eq 0 ] || { echo "::error::go mod tidy failed rc=$TIDY_RC"; exit 1; }
          echo "=== assert go directive did not drift ==="
          grep -q '^go 1.25.6$' go.mod || { echo "::error::go directive drifted after tidy:"; grep -E '^(go|toolchain)' go.mod; exit 1; }
          CGO_LDFLAGS="-O2 -g -s -w -Wl,-z,max-page-size=16384" gomobile bind -v -androidapi=21 -javapkg=com.hiddify.core -libname=hiddify-core -tags=with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api,with_grpc,with_awg,tfogo_checklinkname0,with_naive_outbound,with_conntrack -trimpath -ldflags="-w -s -checklinkname=0 -buildid=" -target=android -gcflags "all=-N -l" -o bin/hiddify-core.aar github.com/sagernet/sing-box/experimental/libbox ./platform/mobile 2>&1 | tee /tmp/gomobile_build.log
          echo "=== toolchain assertion ==="
          unzip -p bin/hiddify-core.aar jni/arm64-v8a/libhiddify-core.so > /tmp/core_arm64.so
          GOV=$(grep -aoE 'go1\.[0-9]+(\.[0-9]+)?' /tmp/core_arm64.so | sort -u | tr '\n' ' ')
          echo "detected go toolchain: $GOV"
          echo "$GOV" | grep -q 'go1\.25\.6' || { echo "::error::wrong go toolchain: $GOV"; exit 1; }

      - name: Upload resolved go.mod and go.sum
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resolved-go-modules
          path: |
            hiddify-core/go.mod
            hiddify-core/go.sum
          retention-days: 7

      - name: Copy AAR to app libs
        run: |
          mkdir -p android/app/libs
          cp hiddify-core/bin/hiddify-core.aar android/app/libs/

      - name: Generate code and build APK
        run: |
          set -eo pipefail
          {
            flutter pub get
            dart run build_runner build --delete-conflicting-outputs
            dart run slang
            flutter build apk --release
          } 2>&1 | tee /tmp/flutter_build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hiddify-app-ech
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Publish APK to Releases
        if: success()
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ech-latest
          name: Hiddify with ECH (rolling build)
          prerelease: true
          allowUpdates: true
          replacesArtifacts: true
          artifacts: build/app/outputs/flutter-apk/app-release.apk
          body: "Automated rolling build with ECH support (v2rayN format). Commit: ${{ github.sha }}"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build-log
          path: /tmp/flutter_build.log
          retention-days: 7

      - name: Diagnose
        if: always()
        run: |
          echo "=== go mod tidy log ===" > diag.txt
          tail -60 /tmp/gomod_tidy.log >> diag.txt 2>/dev/null || echo "(none)" >> diag.txt
          echo "=== gomobile log ===" >> diag.txt
          tail -100 /tmp/gomobile_build.log >> diag.txt 2>/dev/null || echo "(none)" >> diag.txt
          echo "=== flutter log ===" >> diag.txt
          cat /tmp/flutter_build.log 2>/dev/null | tail -50 >> diag.txt || echo "no flutter log" >> diag.txt
          git config user.email "d@l"; git config user.name "d"
          git add diag.txt
          git commit -m "diag [skip ci]" || true
          git push origin ech-support || true

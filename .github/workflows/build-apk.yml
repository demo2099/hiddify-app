name: Build APK with ECH Support

on:
  push:
    branches: [ech-support]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.38.5'
  JAVA_VERSION: '17'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - name: Force HTTPS for all git URLs
        run: |
          SSH_PREFIX=$(printf 'Z2l0QGdpdGh1Yi5jb206' | base64 -d)
          git config --global "url.https://github.com/.insteadOf" "$SSH_PREFIX"
          git config --global "url.https://github.com/.insteadOf" "ssh://${SSH_PREFIX/:/}"
          {
            echo "GIT_CONFIG_COUNT=2"
            echo "GIT_CONFIG_KEY_0=url.https://github.com/.insteadOf"
            echo "GIT_CONFIG_VALUE_0=$SSH_PREFIX"
            echo "GIT_CONFIG_KEY_1=url.https://github.com/.insteadOf"
            echo "GIT_CONFIG_VALUE_1=ssh://${SSH_PREFIX/:/}"
          } >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          ref: ech-support

      - name: Init submodules
        run: |
          SSH_PREFIX=$(printf 'Z2l0QGdpdGh1Yi5jb206' | base64 -d)
          git config --global "url.https://github.com/.insteadOf" "$SSH_PREFIX"
          git config --global "url.https://github.com/.insteadOf" "ssh://${SSH_PREFIX/:/}"
          git submodule update --init --recursive

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.21.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3

      - name: Clean up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          rm -rf ~/.gradle/caches
          df -h

      - name: Install NDK and SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "ndk;27.0.12077973" "ndk;28.2.13676358" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install gomobile
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.12
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.12

      - name: Build hiddify-core AAR
        working-directory: hiddify-core
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          export ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/27.0.12077973
          CGO_LDFLAGS="-O2 -g -s -w -Wl,-z,max-page-size=16384" gomobile bind -v -androidapi=21 -javapkg=com.hiddify.core -libname=hiddify-core -tags=with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api,with_grpc,with_awg,tfogo_checklinkname0,with_purego -trimpath -ldflags="-w -s -checklinkname=0 -buildid=" -target=android -gcflags "all=-N -l" -o bin/hiddify-core.aar github.com/sagernet/sing-box/experimental/libbox ./platform/mobile

      - name: Copy AAR to app libs
        run: |
          mkdir -p android/app/libs
          cp hiddify-core/bin/hiddify-core.aar android/app/libs/

      - name: Flutter build APK
        run: |
          flutter pub get
          flutter build apk --release 2>&1 | tee /tmp/flutter_build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hiddify-app-ech
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Publish APK to Releases
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete ech-latest --repo demo2099/hiddify-app --yes || true
          git push origin :refs/tags/ech-latest || true
          sleep 3
          gh release create ech-latest build/app/outputs/flutter-apk/app-release.apk \
            --repo demo2099/hiddify-app \
            --title "Hiddify with ECH (rolling build)" \
            --notes "Automated rolling build with ECH support (v2rayN format). Commit: ${{ github.sha }}" \
            --prerelease

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build-log
          path: /tmp/flutter_build.log
          retention-days: 7

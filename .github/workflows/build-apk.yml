name: Build APK with ECH Support

on:
  push:
    branches: [ech-support]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.38.5'
  JAVA_VERSION: '17'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - name: Force HTTPS for all git URLs
        run: |
          SSH_PREFIX=$(printf 'Z2l0QGdpdGh1Yi5jb206' | base64 -d)
          git config --global "url.https://github.com/.insteadOf" "$SSH_PREFIX"
          git config --global "url.https://github.com/.insteadOf" "ssh://${SSH_PREFIX/:/}"
          {
            echo "GIT_CONFIG_COUNT=2"
            echo "GIT_CONFIG_KEY_0=url.https://github.com/.insteadOf"
            echo "GIT_CONFIG_VALUE_0=$SSH_PREFIX"
            echo "GIT_CONFIG_KEY_1=url.https://github.com/.insteadOf"
            echo "GIT_CONFIG_VALUE_1=ssh://${SSH_PREFIX/:/}"
          } >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          ref: ech-support

      - name: Init submodules
        run: |
          SSH_PREFIX=$(printf 'Z2l0QGdpdGh1Yi5jb206' | base64 -d)
          git config --global "url.https://github.com/.insteadOf" "$SSH_PREFIX"
          git config --global "url.https://github.com/.insteadOf" "ssh://${SSH_PREFIX/:/}"
          git submodule update --init --recursive

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: hiddify-core/go.mod
          check-latest: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.21.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3

      - name: Clean up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          rm -rf ~/.gradle/caches
          df -h

      - name: Install NDK and SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "ndk;28.2.13676358" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install gomobile v0.1.11 (matching official)
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.11
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.11

      - name: Downgrade gomobile dependency to v0.1.11
        working-directory: hiddify-core
        run: |
          sed -i 's|github.com/sagernet/gomobile v0.1.12|github.com/sagernet/gomobile v0.1.11|g' go.mod
          sed -i 's|github.com/sagernet/gomobile v0.1.12|github.com/sagernet/gomobile v0.1.11|g' hiddify-sing-box/go.mod
          export PATH=$PATH:$(go env GOPATH)/bin
          go mod tidy
          cd hiddify-sing-box && go mod tidy 2>/dev/null || true
          grep gomobile go.mod
          grep gomobile hiddify-sing-box/go.mod

      - name: Build hiddify-core AAR
        working-directory: hiddify-core
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          export ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/28.2.13676358
          CGO_LDFLAGS="-O2 -g -s -w -Wl,-z,max-page-size=16384" gomobile bind -v -androidapi=21 -javapkg=com.hiddify.core -libname=hiddify-core -tags=with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api,with_grpc,with_awg,tfogo_checklinkname0,with_naive_outbound,with_conntrack -trimpath -ldflags="-w -s -checklinkname=0 -buildid=" -target=android -gcflags "all=-N -l" -o bin/hiddify-core.aar github.com/sagernet/sing-box/experimental/libbox ./platform/mobile

      - name: Copy AAR to app libs
        run: |
          mkdir -p android/app/libs
          cp hiddify-core/bin/hiddify-core.aar android/app/libs/

      - name: Generate code and build APK
        run: |
          set -eo pipefail
          {
            flutter pub get
            dart run build_runner build --delete-conflicting-outputs
            dart run slang
            flutter build apk --release
          } 2>&1 | tee /tmp/flutter_build.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hiddify-app-ech
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Publish APK to Releases
        if: success()
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ech-latest
          name: Hiddify with ECH (rolling build)
          prerelease: true
          allowUpdates: true
          replacesArtifacts: true
          artifacts: build/app/outputs/flutter-apk/app-release.apk
          body: "Automated rolling build with ECH support (v2rayN format). Commit: ${{ github.sha }}"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build-log
          path: /tmp/flutter_build.log
          retention-days: 7

      - name: Diagnose
        if: always()
        run: |
          cp /tmp/flutter_build.log diag.txt 2>/dev/null || echo "no log" > diag.txt
          git config user.email "d@l"; git config user.name "d"
          git add diag.txt
          git commit -m "diag [skip ci]" || true
          git push origin ech-support || true

name: Build APK with ECH Support

on:
  push:
    branches: [ech-support]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.38.5'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Force HTTPS for all git URLs
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/" && git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ech-support

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Show Go version
        run: go version

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager 'ndk;28.2.13676358'

      - name: Clean disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          rm -rf ~/.gradle/caches
          sudo apt-get autoremove -y && sudo apt-get clean

      - name: Verify submodules
        run: |
          ls hiddify-core/hiddify-sing-box/go.mod || echo "MISSING hiddify-sing-box"
          ls hiddify-core/ray2sing/ray2sing/common.go || echo "MISSING ray2sing"
          ls hiddify-core/hiddify-sing-box/replace/wireguard-go/go.mod || echo "MISSING wireguard-go"

      - name: Install gomobile
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.11
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.11
          gomobile init

      - name: Build hiddify-core AAR from source
        working-directory: hiddify-core
        run: |
          go version
          make android 2>&1 | tail -50

      - name: Move AAR to android libs
        run: |
          mkdir -p android/app/libs
          cp hiddify-core/bin/hiddify-core.aar android/app/libs/

      - name: Flutter pub get
        run: flutter pub get

      - name: Run code generation
        run: |
          dart run build_runner build --delete-conflicting-outputs
          dart run slang

      - name: Install fastforge
        run: dart pub global activate fastforge

      - name: Build APK
        run: |
          fastforge package \
            --platform android \
            --targets apk \
            --skip-clean \
            --build-target=lib/main.dart \
            --build-target-platform=android-arm,android-arm64,android-x64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hiddify-APK-ECH
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 7

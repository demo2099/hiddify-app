name: Build APK with ECH Support
on:
  push:
    branches: [ech-support]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Force HTTPS for all git URLs
        run: |
          git config --global url. https://github.com/.insteadOf ssh://git@github.com/
          git config --global url.https://github.com/.insteadOf git@github.com:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          ref: ech-support
      - run: echo done
